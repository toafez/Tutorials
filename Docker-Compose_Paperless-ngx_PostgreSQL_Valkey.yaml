# Paperless-ngx:latest inklusive PostgreSQL 18 und Valkey 9
# YAML-Dateiversion: 1.50 vom 25.10.2026

# CHANGELOG
# - WARNUNG: Es ist dringend davon abzuraten, diesen Docker-Compose-Stack durch eine bereits installierte Stack-Version
#   von Paperless-ngx zu ersetzen. Aufgrund der nachfolgenden Änderungen kann es sonst zu Datenverlust kommen.
# - In diesem Docker-Compose-Stack wurde die ursprünglich reine Verwendung von Bind Mounts mit Named Volumes kombiniert.
# - Durch die Verwendung von Named Volumes werden PostgreSQL-Datenbankinhalte und weitere Daten anderer Services nicht
#   mehr persistent im Projektverzeichnis von Paperless-ngx gespeichert, sondern in einem von Docker lokal verwalteten
#   Speicherpfad für Volumes abgelegt. Beachte hierzu auch die ALLGEMEINEN HINWEISE.
# - Diesem Docker-Compose-Stack wurden ALLGEMEINE HINWEISE sowie INSTALLATIONSHINWEISE hinzugefügt.
# - Der interne PostgreSQL-Pfad wurde von "/var/lib/postgresql/18/docker" nach "/var/lib/postgresql" umgestellt. 

# ALLGEMEINE HINWEISE
#
# - Named Volumes
#   werden für interne Anwendungsoperationen wie Datenbanken (PostgreSQL, MariaDB etc.), automatisch verwaltete
#   Konfigurationen oder sensible Anwendungsdaten verwendet, die von der Anwendung selbst erstellt und in einem von
#   Docker lokal verwalteten Speicherpfad für Volumes (volumes storage path) persistent gespeichert werden. Sie bieten
#   bessere Performance, Datenschutz und Portabilität, da die Daten nicht direkt auf dem Host-System einsehbar sind.
#   Named Volumes werden sowohl im volumes:-Eintrag eines Services als Referenz als auch in der globalen
#   volumes:-Sektion am Ende des Stacks als Definition konfiguriert. Wichtig zu erwähnen ist hierbei, dass ein 
#   Named Volume keine Pfad-Präfixe wie ./ oder ../ enthalten darf.
#
#   Beispiel:
#      - Referenz im Service "db": 
#          db:
#            volumes:
#              - pgdata:/var/lib/postgresql:rw
#
#      - Definition in der globalen volumes:-Sektion:
#        volumes:
#          pgdata:
#
#   In normalen Docker-Umgebungen befindet sich der Speicherpfad für Named Volumes in der Regel unter
#   /var/lib/docker/volumes/. Auf einem UGREEN-NAS mit UGOS Pro unter Verwendung der Docker-App liegt dieser Pfad
#   jedoch unter /volume[X]/@docker/volumes/. Eine Übersicht aller vorhandenen Volumes erhält man durch den Befehl:
#   sudo docker volume ls
#
#   Detaillierte Informationen zu einem bestimmten Volume inklusive des tatsächlichen Mountpfades zeigt der Befehl:
#   sudo docker volume inspect [VOLUME_NAME]
#
#   Nachdem der zugehörige Container bzw. das Projekt gestoppt und aus der Docker-App vollständig gelöscht wurde, 
#   kann ein Named Volume mit folgendem Befehl gelöscht werden.
#   sudo docker volume rm [VOLUME_NAME]
#
# - Bind Mounts
#   beziehen sich auf unmittelbar erreichbare Pfade des Host-Systems, auf die der Nutzer direkt zugreifen muss, wie
#   beispielsweise persönliche Daten, Konfigurationsdateien oder Backups. Die Pfade müssen dabei entweder relativ zum
#   Ort des Projektverzeichnisses oder absolut angegeben werden. Diese Pfade werden nur als Referenz im volumes:-Eintrag
#   des Services angegeben und erfordern keine globale Definition in der volumes:-Sektion am Ende des Stacks.
#
#   - Relative Pfadangabe bezogen auf das beispielhaft genannte Projektverzeichnis "/volume1/docker/project"
#      volumes:
#         - ./data:/app/data:rw
#           (Der absolute Pfad entspricht in diesem Beispiel "/volume1/docker/project/data")
#         - ../../backup/project:/app/data/export:rw
#           (Der absolute Pfad entspricht in diesem Beispiel "/volume1/backup/project")
#
#   - Absolute Pfadangabe:
#      volumes:
#         - /volume1/docker/project/data:/app/data:rw
#         - /volume1/backup/project:/app/data/export:rw

# INSTALLATION
# - Erstelle  ein neues, leeres Projektverzeichnis mit dem Namen „paperless-nxg” im Arbeitsverzeichnis von Docker
#   wie beispielsweise "/volume1/docker/paperless-ngx".
# - Wechsle in das eben erstellte Projektverzeichnis und lege die Unterverzeichnisse "consume", "export" und "media" an.
#   Du kannst "consume", "export" und "media" auch an anderen Speicherorten anlegen oder darauf verweisen, sofern diese
#   erreichbar, lesbar und beschreibbar sind.
# - Kopiere den Inhalt dieses Docker-Compose-Stacks in das Editorfenster der UGOS Pro Docker-App, Portainer etc. 
#   und passe alle benutzerdefinierten Einstellungen im Stack entsprechend an.
# - Ändere vor dem Deployment in jedem Fall die folgenden vorgegebenen Key-Value-Paare ab.
#      POSTGRES_PASSWORD: paperless
#      PAPERLESS_DBPASS: paperless
#      PAPERLESS_ADMIN_USER: admin-user
#      PAPERLESS_ADMIN_PASSWORD: admin-password
#      PAPERLESS_SECRET_KEY: change-me
# - Führe die Installation von Paperless-ngx aus, indem du das Projekt bereitstellst bzw. deployst.
#
# - Die endgültige Verzeichnisstruktur sollte wie folgt aussehen:
#    /volume[X]/docker/paperless-ngx/
#    ├── consume/            (eingehende Dokumente)
#    ├── export/             (exportierte Dokumente)
#    ├── media/              (importierte Dokumente)
#    └── docker-compose.yaml (wird nach erfolgreichem Deployen mit der UGOS Pro Docker-App erstellt)
#
#   HINWEIS: In diesem Stack wird der Ordner "media" bewusst als Bind Mount eingebunden. Zum Schutz der persönlichen
#            Daten kann dieser Ordner alternativ auch so deklariert werden, wie es im Original-Docker-Compose-Stack
#            von Paperless-ngx vorgesehen ist, d. h. als Named Volume (wie unter ALLGEMEINE HINWEISE beschrieben). 

services:

# Valkey Container
  broker:
    image: docker.io/valkey/valkey:9-alpine

    # Name des Redis-Containers (nach Bedarf anpassen)
    container_name: Paperless-ngx-Valkey
    restart: unless-stopped

    # Sicherheitsoptionen
    security_opt:
      - no-new-privileges:true

    # Named Volumes bzw. Bind Mounts Speicherorte 
    # (Bei Verwendung von Bind Mounts einen relativen oder absoluten Pfad vor dem Doppelpunkt eintragen,
    # ansonsten nur einen Referenznamen für den volumes:-Service angeben.)
    volumes:
      - valkeydata:/data:rw

    # Gesundheitscheck des Valkey-Containers
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

# PostgreSQL Container
  db:
    image: docker.io/library/postgres:18

    # Name des PostgreSQL-Containers (nach Bedarf anpassen)
    container_name: Paperless-ngx-PostgreSQL
    # Hostname des PostgreSQL-Containers (nach Bedarf anpassen)
    hostname: paperless-postgres-db
    restart: unless-stopped

    # Sicherheitsoptionen
    security_opt:
      - no-new-privileges:true

    # Named Volumes bzw. Bind Mounts Speicherorte 
    # (Bei Verwendung von Bind Mounts einen relativen oder absoluten Pfad vor dem Doppelpunkt eintragen,
    # ansonsten nur einen Referenznamen für den volumes:-Service angeben.)
    volumes:
      - pgdata:/var/lib/postgresql:rw

    # Umgebungsvariablen
    environment:
      # Datenbankname (nach Bedarf anpassen)
      POSTGRES_DB: paperless
      # Datenbankbenutzer (nach Bedarf anpassen)
      POSTGRES_USER: paperless
      # Datenbankpasswort (nach Bedarf anpassen)
      POSTGRES_PASSWORD: paperless

    # Gesundheitscheck des PostgreSQL-Containers
    healthcheck:
      #                                      Datenbankname      Datenbankbenutzer
      test: ["CMD", "pg_isready", "-q", "-d", "paperless", "-U", "paperless"]
      interval: 30s
      timeout: 10s
      retries: 5

# Paperless-ngx Container
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest

    # Name des Paperless-ngx-Containers (nach Bedarf anpassen)
    container_name: Paperless-ngx
    restart: unless-stopped

    # Festlegung der Reihenfolge und Ausführung weiterer Dienste-Abhängigkeiten
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy

    # Sicherheitsoptionen
    security_opt:
      - no-new-privileges:true

    # Weiterleitungsport
    ports:
      - "8180:8000"

    # Gesundheitscheck des Paperless-ngx-Containers
    # In der aktuellen Paperless-ngx-Image-Definition ist der Healthcheck bereits standardmäßig enthalten.

    # Named Volumes bzw. Bind Mounts Speicherorte 
    # (Bei Verwendung von Bind Mounts einen relativen oder absoluten Pfad vor dem Doppelpunkt eintragen,
    # ansonsten einen Referenznamen für den volumes:-Service sowie für die volumes:-Sektion angeben.)
    volumes:
      - data:/usr/src/paperless/data:rw
      - ./media:/usr/src/paperless/media:rw
      - ./export:/usr/src/paperless/export:rw
      - ./consume:/usr/src/paperless/consume:rw

    # Umgebungsvariablen
    environment:

      # Umgebungsvariablen für PostgreSQL festlegen
      # Festlegung der verwendeten Datenbank-Engine. Zulässige Werte sind „sqlite“, „postgresql“ und „mariadb“.
      PAPERLESS_DBENGINE: postgresql
      # Hostname des PostgreSQL-Containers (entspricht der Variablen "hostname" im Abschnitt "db")
      PAPERLESS_DBHOST: paperless-postgres-db
      # Datenbankname (entspricht der Variablen "POSTGRES_DB" des Dienstes "db")
      PAPERLESS_DBNAME: paperless
      # Benutzername (entspricht der Variablen "POSTGRES_USER" des Dienstes "db")
      PAPERLESS_DBUSER: paperless
      # Datenbankpasswort (entspricht der Variablen "POSTGRES_PASSWORD" des Dienstes "db")
      PAPERLESS_DBPASS: paperless

      # Umgebungsvariablen für Valkey festlegen (Das hier die Bezeichnung redis verwendet wird ist korrekt!)
      PAPERLESS_REDIS: redis://broker:6379

      # Umgebungsvariablen für den Paperless-ngx-Container festlegen
      # Benutzer-ID des berechtigten Docker-Systembenutzers (nach Bedarf anpassen)
      USERMAP_UID: 1000
      # Gruppen-ID des berechtigten Docker-Systembenutzers (nach Bedarf anpassen)
      USERMAP_GID: 10
      # Name des Paperless-ngx Benutzers (nach Bedarf anpassen)
      PAPERLESS_ADMIN_USER: admin-user
      # Passwort des Paperless-ngx Benutzers (nach Bedarf anpassen)
      PAPERLESS_ADMIN_PASSWORD: admin-password
      # Für den Sitzungstoken und die Signierung ist ein eindeutiger, mindestens 64 Zeichen langer, geheimer Schlüssel erforderlich.
      # Die Generierung kann beispielsweise über die Linux-Kommandozeile mithilfe des folgenden Befehls erfolgen.
      # python3 -c "import secrets; print(secrets.token_urlsafe(64))"
      PAPERLESS_SECRET_KEY: change-me
      # Zeitzone (nach Bedarf anpassen)
      PAPERLESS_TIME_ZONE: Europe/Berlin
      # OCR-Sprache (nach Bedarf anpassen)
      PAPERLESS_OCR_LANGUAGE: deu+eng
      # Standard-OCR-Dateinamenformat (nach Bedarf anpassen)
      PAPERLESS_FILENAME_FORMAT: '{{ correspondent }}/{{ document_type }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ title }}'
      # Entferne alle Platzhalter, die als "none" aufgelöst wurden.
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: true
      # Entferne alle doppelten Dateien aus dem Ordner "Consume"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
      # Dateien in Unterordnern des Consumeordners erfassen
      PAPERLESS_CONSUMER_RECURSIVE: true
      # Die digitale Signatur von PDF-Dokumenten ungültig machen, um die OCR-Verarbeitung zu ermöglichen
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'

# volumes:-Sektion in der alle verwendeten Volumes dieses Stacks definiert werden
volumes:
    data:
    pgdata:
    valkeydata:
